services:
  - type: web
    name: novadrop-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --config gunicorn_config.py
    envVars:
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: novadrop-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://rajpootsurya9198-collab.github.io
      - key: SEED_DEMO_DATA
        value: "true"

databases:
  - name: novadrop-db
    databaseName: novadrop
    user: novadrop_user
